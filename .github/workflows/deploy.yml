name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── 1. Run unit tests ────────────────────────────────────────────────────────
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: pharmacy-server/package-lock.json

      - name: Install dependencies
        working-directory: pharmacy-server
        run: npm ci

      - name: Run unit tests
        working-directory: pharmacy-server
        run: npm run test:unit

  # ── 2. Build & push Docker images ────────────────────────────────────────────
  build-and-push:
    name: Build & Push Docker Images
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & Push server image
        uses: docker/build-push-action@v5
        with:
          context: ./pharmacy-server
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/pharmacy-server:latest

      - name: Build & Push client image
        uses: docker/build-push-action@v5
        with:
          context: ./pharmacy-client
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/pharmacy-client:latest
          build-args: VITE_API_URL=${{ secrets.PROD_API_URL }}

  # ── 3. Deploy via SSH ─────────────────────────────────────────────────────────
  deploy:
    name: Deploy to Production
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host:     ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key:      ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /opt/pharmacy
            docker-compose pull
            docker-compose up -d --remove-orphans
            docker system prune -f
            echo "Deployed at $(date)"
