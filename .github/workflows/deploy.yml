name: CI/CD Pipeline

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: pharmacy-server/package-lock.json

      - name: Install dependencies
        working-directory: pharmacy-server
        run: npm ci

      - name: Run unit tests
        working-directory: pharmacy-server
        run: npm run test:unit

  build-and-push:
    name: Build & Push Docker Images
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & Push server image
        uses: docker/build-push-action@v5
        with:
          context: ./pharmacy-server
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/pharmacy-server:latest

      - name: Build & Push client image
        uses: docker/build-push-action@v5
        with:
          context: ./pharmacy-client
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/pharmacy-client:latest
          build-args: VITE_API_URL=${{ secrets.PROD_API_URL }}

  deploy:
    name: Deploy to Railway
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy backend to Railway
        run: railway up --service server --detach
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

      - name: Deploy frontend to Railway
        run: railway up --service client --detach
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}